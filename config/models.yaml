  # ------------------------------ Ollama ----------------------------------
  # Marginal cost is zero, but latency is real and quality is the constraint.
  - key: llama3.1-local
    provider: ollama
    model_id: llama3.1:latest
    display_name: Llama 3.1 8B (local)
    input_cost_per_1m: 0.0
