# ---------------------------------------------------------------------------
# Model registry.
#
# Costs are USD per 1,000,000 tokens -- the unit every provider publishes.
# The registry converts to per-token internally so cost math never carries a
# hand-typed 1e-6 around the codebase.
#
# `avg_latency_ms` is a SEED value only. scripts/phase1_baseline.py overwrites
# these with measured p50s from your own machine/region (see
# config/measured_latency.yaml, which is layered on top at load time).
#
# Pricing provenance:
#   anthropic -- claude-api skill pricing table, cached 2026-06-24.
#   openai    -- public list pricing; VERIFY before quoting savings numbers.
#   ollama    -- local inference, $0 marginal cost by definition.
# ---------------------------------------------------------------------------

version: 1

models:
  # ---------------------------- Anthropic ---------------------------------
  - key: claude-opus-5
    provider: anthropic
    model_id: claude-opus-5
    display_name: Claude Opus 5
    input_cost_per_1m: 5.00
    output_cost_per_1m: 25.00
    avg_latency_ms: 6000
    quality_tier: high
    context_window: 1000000
    max_output_tokens: 64000
    pricing_verified: true
    notes: Reference model. Used as the LLM-as-judge and the escalation target.

  - key: claude-sonnet-5
    provider: anthropic
    model_id: claude-sonnet-5
    display_name: Claude Sonnet 5
    input_cost_per_1m: 2.00
    output_cost_per_1m: 10.00
    avg_latency_ms: 3200
    quality_tier: medium
    context_window: 1000000
    max_output_tokens: 64000
    pricing_verified: true

  - key: claude-haiku-4-5
