    input_cost_per_1m: 0.0
    output_cost_per_1m: 0.0
    avg_latency_ms: 900
    quality_tier: low
    context_window: 128000
    max_output_tokens: 4096
    pricing_verified: true

  # ------------------------------- Mock -----------------------------------
  # Deterministic, offline. Priced like a mid-tier cloud model so that cost
  # dashboards look realistic when running the pipeline without API keys.
  - key: mock-premium
    provider: mock
    model_id: mock-premium
    display_name: Mock Premium (offline)
